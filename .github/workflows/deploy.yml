name: NexAccess - CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # BUILD - COMPILAR Y PUBLICAR EN GHCR
  # ==========================================
  build:
    name: Build y publicar imagen
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/sof2702/nexaccess:dev

  # ==========================================
  # DEPLOY - ROCKY LINUX
  # ==========================================
  deploy:
    name: Desplegar en Rocky Linux
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Actualizar NexAccess
        shell: bash
        run: |
          sudo -n /opt/nexaccess/scripts/deploy-ci.sh

      - name: Verificar API
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://192.168.0.6:8060/api/v1/health

      - name: Confirmar despliegue
        run: echo "NexAccess desplegado correctamente"

