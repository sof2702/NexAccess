name: NexAccess - CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nexaccess-deploy
  cancel-in-progress: false

jobs:

  # ==========================================
  # BUILD - GITHUB ACTIONS
  # ==========================================
  build:
    name: Build y publicar imagen
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar NexAccess
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/sof2702/nexaccess:dev

  # ==========================================
  # DEPLOY - ROCKY LINUX
  # ==========================================
  deploy:
    name: Desplegar en Rocky Linux
    needs: build

    runs-on: [self-hosted, Linux, X64]

    timeout-minutes: 20

    steps:
      - name: Actualizar NexAccess
        run: |
          sudo -n /usr/bin/systemctl start nexaccess-deploy.service

      - name: Verificar API
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 2 \
            http://127.0.0.1:8060/api/v1/health

      - name: Confirmar despliegue
        run: |
          echo "NexAccess desplegado correctamente en Rocky Linux"

